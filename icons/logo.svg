<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sophie Fit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23907f"/>
      <stop offset="1" stop-color="#123532"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#ff6a4d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- rising sun behind the letter -->
  <circle cx="256" cy="262" r="150" fill="url(#sun)"/>
  <!-- horizon line -->
  <rect x="86" y="404" width="340" height="18" rx="9" fill="#ffffff" opacity=".22"/>
  <!-- the S as one continuous ribbon, ending in an upward stroke -->
  <path d="M 338 168 C 312 132 188 128 186 204 C 184 276 326 246 326 320 C 326 392 206 398 168 348"
        fill="none" stroke="#123532" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" opacity=".28" transform="translate(6 10)"/>
  <path d="M 338 168 C 312 132 188 128 186 204 C 184 276 326 246 326 320 C 326 392 206 398 168 348"
        fill="none" stroke="#ffffff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- energy spark -->
  <path d="M 392 84 L 404 120 L 440 132 L 404 144 L 392 180 L 380 144 L 344 132 L 380 120 Z" fill="#ffffff"/>
</svg>
